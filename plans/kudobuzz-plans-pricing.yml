quotas_that_bound_api_usage:
  note: >-
    Product-level volume caps published on the Reviews Growth tier. They are not
    HTTP rate limits, but they bound what API-driven review collection and APM
    order sync can do. See rate-limits/kudobuzz-rate-limits.yml for the
    signalling contract (X-Rate-Limit-* + 429); numeric HTTP quotas are not
    published anywhere.
  caps:

notes: >-
  Captured from the public Kudobuzz pricing page on 2026-08-13. Kudobuzz sells
  two separately-priced product lines from one pricing page, selected by a tab:
  "Product & Social Reviews" and "UGC & Shoppable Videos". Card prices and the
  monthly/yearly figures below were read from the server-rendered pricing cards
  (`data-monthly` / `data-yearly` attributes); the feature matrix was read from
  the comparison modal's `data-modal-content` payload on the same page. Nothing
  here is inferred from marketing copy.

  API ACCESS IS A PAID FEATURE, AND THE TWO KUDOBUZZ PAGES DISAGREE ON WHICH
  PLAN CARRIES IT. The pricing page lists "API Access" as a bullet on the
  Reviews "Growth" tier and the comparison matrix marks the "API" row true only
  in the paid column. The Developer API page (https://kudobuzz.com/developer-api,
  which itself carries "Updated August 2026") instead says API access is
  included on the "Buffet" plan — a plan name that appears nowhere on the
  current pricing page. Recorded as a published inconsistency, not resolved:
  a developer reading either page cannot tell which tier to buy.

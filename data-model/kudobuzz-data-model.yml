relationships:
  - from: Customer
    to: Business
    type: belongs_to
    via: business_id
  - from: Order
    to: Business
    type: belongs_to
    via: business_id
  - from: Order
    to: Customer
    type: has_one
    via: customer (embedded summary) / email
  - from: Order
    to: LineItem
    type: has_many
    via: line_items[]
  - from: Review
    to: Reviewer
    type: has_one
    via: reviewer
  - from: Review
    to: Product
    type: belongs_to
    via: external_unique_id[]
    note: >-
      Product is not itself a Kudobuzz-managed entity; it is referenced by the
      merchant's own external product id.
  - from: Customer
    to: Order
    type: has_many
    via: order_id / orders_count
    note: Soft link via the merchant's external platform order id.

external_id_convention:
  detail: >-
    Kudobuzz consistently mirrors the merchant's source-of-truth commerce
    platform (Shopify, Wix, BigCommerce, Shoplazza, Webflow) rather than owning
    the identifiers. Every entity carries an external_*_id or platform-scoped id
    alongside Kudobuzz's own id, and the *_at_platform date fields preserve the
    originating platform's timestamps.
  fields:
    - external_customer_id
    - external_reviewer_id
    - external_unique_id
    - external_channel_id
    - order_id
    - created_at_platform
    - updated_at_platform
  no_id_prefixes: >-
    Kudobuzz does not publish typed id prefixes (unlike e.g. Stripe's cus_/ord_);
    ids are opaque strings.

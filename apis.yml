apis:
- name: Kudobuzz Developer API
  description: >-
    The Kudobuzz Developer API lets merchants and integration developers create
    customer reviews and sync customers and orders into the After Purchase Mail (APM)
    product for segmentation and post-purchase review-request campaigns. Access is
    granted per account rather than self-serve, authenticated with a server-side
    account token plus a browser-side client id. Kudobuzz publishes no OpenAPI
    definition; the reference documents the official JavaScript client wrapper.

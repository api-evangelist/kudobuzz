aid: kudobuzz
name: Kudobuzz
description: >-
  Kudobuzz is a reviews, user-generated content (UGC) and conversion-rate-optimization
  platform for ecommerce merchants. It collects, moderates and displays product and
  social reviews, imports reviews from Facebook, Google, Yelp, Amazon, Etsy and
  AliExpress, syncs shoppable UGC video from social channels, and runs After Purchase
  Mail campaigns that time review requests to a buyer's order. Merchants install it as
  an app on Shopify, Wix, BigCommerce, Shoplazza and Webflow and embed site, product,
  full-page and checkout widgets in their storefronts. The gated Developer API
  (api.kudobuzz.com/v1) exposes review creation plus customer and order sync for the
  APM product, is available to merchants on the Buffet plan and free to app developers
  building integrations, and is served by a first-party JavaScript client wrapper.
  Kudobuzz publishes its REST design standard, covering URLs, status codes, the error
  envelope, versioning, cursor pagination, rate-limit headers and idempotency, as a
  public repository.
